name: Windows v060 world candidate
on:
  push:
    branches: [delivery/v0.6.0-world-candidate.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    defaults:
      run:
        working-directory: project/QIAOMI-AI
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed candidate
        working-directory: .
        shell: pwsh
        run: Expand-Archive -LiteralPath QIAOMI-v0.6.0-P1-P3-CANDIDATE-source.zip -DestinationPath project
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Isolate test data
        shell: pwsh
        run: '"QIAOMI_DATA_DIR=$env:RUNNER_TEMP/qiaomi-candidate-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - name: Dependency validation
        run: python -m pip check
      - name: Full Windows Qt regression
        run: python -m pytest -q --junitxml=test-artifacts/windows-full.xml
      - name: Build GUI executable
        run: python -m PyInstaller --clean --noconfirm qiaomi.spec
      - name: Package complete folder
        shell: pwsh
        run: |
          Copy-Item install_shortcut.vbs dist/QIAOMI-AI/install_shortcut.vbs
          Copy-Item docs/WINDOWS_RELEASE.md dist/QIAOMI-AI/WINDOWS_RELEASE.md
          python scripts/build_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packaged executable smoke check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-artifacts -Force | Out-Null
          $report = Join-Path (Get-Location) 'test-artifacts/frozen-smoke.json'
          $exe = Join-Path (Get-Location) 'dist/QIAOMI-AI/QIAOMI-AI.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test --smoke-report `"$report`"" -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'Smoke timeout' }
          $process.WaitForExit(); $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Smoke exit $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Missing smoke report' }
          if ((Get-Content $report -Raw | ConvertFrom-Json).passed -ne $true) { throw 'Smoke failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QIAOMI-v060-Windows-evidence
          path: |
            project/QIAOMI-AI/test-artifacts/
            project/QIAOMI-AI/build/qiaomi/warn-*.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: QIAOMI-v060-Windows-portable
          path: |
            project/QIAOMI-AI/dist/QIAOMI-AI-Windows-x64.zip
            project/QIAOMI-AI/dist/QIAOMI-AI-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
